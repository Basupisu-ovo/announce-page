<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学校案内</title>

    <link rel="stylesheet" type="text/css" href="announce.css" id="CSSPattern" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div id="app">
        <!-- スタート画面 -->
        <div id="start" class="isActive">
            <div id="Title">情報1班テスト用webサイト</div>
            <select name="pattern" id="patternSelect">
                <option value="1">パターン1</option>
                <option value="2">パターン2</option>
                <option value="3">パターン3</option>
                <option value="4">パターン4</option>
            </select>

            <div id="startButtons">
                <button type="button" id="exStartBut" class="sButton">見本を見る</button>
                <button type="button" id="StartBut" class="sButton">はじめる</button>
            </div>
        </div>
        <!-- ヘッダー -->
        <header id="header" class="">
            <div id="header_label">
                <div id="header_font">
                    延岡高校案内ページ
                </div>

            </div>
            <div id="headerButtons">
                <button id="toHomeButton" class="headerButton" type="button">
                    <span class="homeIcon headerButtonFont">
                        HOME
                    </span>
                </button>

                <button id="mapButton" class="headerButton" type="button">
                    <span class="homeIcon headerButtonFont">
                        ▶ MAP
                    </span>
                </button>
            </div>


        </header>

        <!-- ホーム画面 -->
        <div id="home" class="pageContents ">

            <!-- お知らせページ -->
            <div id="homeAnnounce" class="homeContents">
                <div id="announceCont" class="newsCont">
                    <p id="announceFont">
                        お知らせ
                    </p>
                    <table id="announce" class="homeTable">
                        <thead>
                            <tr class="announceTR">
                                <th class="homeTH" id="announceDateHead">日付</th>
                                <th class="homeTH" id="announceDetailHead">内容</th>
                                <th class="homeTH"></th>
                            </tr>
                        </thead>

                        <tbody id="announceBody">
                            <tr class="announceTR">
                                <td id="AnnContinueButton" class="continueButton" colspan="2">
                                    <button type="button" id="otherAnnBut">▼その他のお知らせを見る</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div id="scheduleCont" class="newsCont">
                    <p id="scheduleFont">
                        行事予定
                    </p>

                    <table id="schedule" class="homeTable">
                        <thead>
                            <tr class="scheduleTR">
                                <th class="homeTH" id="scheduleDateHead">日付</th>
                                <th class="homeTH" id="scheduleDetailHead">内容</th>
                                <th class="homeTH"></th>
                            </tr>
                        </thead>

                        <tbody id="scheduleBody">
                            <tr class="scheduleTR">
                                <td class="scheduleDate">0/0</td>
                                <td class="scheduleDetail">~~~</td>
                                <td class="announceMore">
                                    <button type="button" class="moreButton">
                                        <i class="fa-solid fa-ellipsis"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr class="scheduleTR">
                                <td class="scheduleDate">00:00</td>
                                <td class="scheduleDetail">~~~</td>
                                <td class="announceMore">
                                    <button type="button" class="moreButton">
                                        <i class="fa-solid fa-ellipsis"></i>
                                    </button>
                                </td>
                            </tr>

                            <tr class="scheduleTR">
                                <td id="schContinueButton" class="continueButton" colspan="2">
                                    <div type="button" id="otherPlanBut">▼その他の行事予定を見る</div>
                                </td>
                            </tr>
                        </tbody>
                        
                        
                    </table>
                </div>


            </div>

            <div id="Buttons" class="homeContents">
                <!-- ボタン1 -->
                <button id="button1" class="SelectButton" type="button">
                    <span class="buttonTag">MAP</span>
                </button>
                <!-- ボタン2 -->
                <button id="button2" class="SelectButton" type="button">
                    <span class="buttonTag">忘れ物</span>
                </button>
                <!-- ボタン3 -->
                <button id="button3" class="SelectButton" type="button">
                    <span class="buttonTag">機能3</span>
                </button>
                <!-- ボタン4 -->
                <button id="button4" class="SelectButton" type="button">
                    <span class="buttonTag">機能4</span>
                </button>
            </div>
            <!-- テーブル表示用ダイアログ -->
            <dialog id="tableDialog">
                <table id="dialogTable">
                    <thead>
                        <tr class="dialogTableTR">
                            <th class="dialogDate">日付</th>
                            <th class="dialogDetail">内容</th>
                        </tr>
                    </thead>
                    <tbody id="dialogTableBody" class="">
                    </tbody>
                </table>
            </dialog>
            <!-- 詳細表示用ダイアログ -->
            <dialog id="detailDialog">
                <div id="dialogTitle">エラーが発生しました</div>
                <div id="dialogDate"></div>
                <div id="dialogPlace"></div>
                <div id="dialogDetail"></div>
                <div id="dialogFrom"></div>
            </dialog>
        </div>

        <!-- MAP画面 -->
        <div id="map" class="pageContents">
            <div id="mapLayoutContainer">
                <div id="mapLeftPanel">
                    <div id="searchSelect">
                        <div id="mapHeader">
                            <button id="searchButton">教室を検索</button>
                            <div id="selectClass">
                                <p id="textClass" class="displayClass">選択されている教室</p>
                                <p id="selectedClass" class="displayClass">何も選択されていません</p>
                            </div>
                        </div>

                        <dialog>
                            <select name="firstSelect" id="firstSelect" class="classroomsSel">
                                <option value="" disabled selected>分類を選択してください</option>
                                <option value="homerooms">教室</option>
                                <option value="specialRooms">特別教室</option>
                                <option value="otherRooms">その他</option>
                            </select>

                            <select name="secondSelect" id="secondSelect" class="classroomsSel" disabled>
                                <option value="" disabled selected>先に種類を選択してください</option>
                            </select>
                        </dialog>
                    </div>

                    <!-- 上下フロア切替コントローラー -->
                    <div id="floorController">
                        <button type="button" id="prevFloorBtn" class="floorBtn">
                            <i class="fa-solid fa-chevron-up"></i>
                        </button>
                        <span id="currentFloorText">1F</span>
                        <button type="button" id="nextFloorBtn" class="floorBtn">
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                    </div>
                </div>
